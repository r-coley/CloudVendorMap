<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>Cloud &amp; Customer Data Center Locations</title>
<link href="./css/style.css" rel="stylesheet" type="text/css" />
<script type="text/javascript" src="./js/maps.js"></script>
<script type="text/javascript" src="./js/world-loader.js"></script>
<script type="text/javascript" src="./js/data-loader.js"></script>
<script type="text/javascript" src="./js/main.js"></script>
</head>

<body>
<div id="wrapper">
<header class="page-header">
<div>
<p class="eyebrow">INFRASTRUCTURE AT A GLANCE</p>
<h1>Cloud &amp; Customer Data Center Locations</h1>
<p class="subtitle">Explore public cloud regions and customer data-center locations around the world.</p>
</div>
</header>

<div id="mapContainer">
<div id="map">
<div id="mapControls">
<button id="home" type="button" aria-label="Reset map view" title="Reset map view"><span aria-hidden="true">⌂</span></button>
<button id="plus" type="button" aria-label="Zoom in" title="Zoom in"><span aria-hidden="true">+</span></button>
<button id="minus" type="button" aria-label="Zoom out" title="Zoom out"><span aria-hidden="true">−</span></button>
</div>
</div>
<div id="mapButtons" aria-label="Map filters">
<p class="panel-label">Show locations</p>
<button id="ali" class="btn provider-ali" data-provider="ALI" type="button" aria-pressed="false"><span>Alibaba Cloud</span></button>
<button id="aws" class="btn provider-aws" data-provider="AWS" type="button" aria-pressed="false"><span>Amazon Web Services</span></button>
<button id="azure" class="btn provider-azure" data-provider="Azure" type="button" aria-pressed="false"><span>Microsoft Azure</span></button>
<button id="gcp" class="btn provider-gcp" data-provider="GCP" type="button" aria-pressed="false"><span>Google Cloud</span></button>
<button id="oci" class="btn provider-oci" data-provider="OCI" type="button" aria-pressed="false"><span>Oracle Cloud (OCI)</span></button>
<button id="customer" class="btn provider-customer" data-provider="CUSTOMER" type="button" aria-pressed="false"><span id="customerButtonLabel">Customer DC's</span></button>
<div class="option-divider"></div>
<p class="panel-label panel-label-options">Map layers</p>
<label class="switch-row" for="countryHighlighting">
<span><strong>Country highlighting</strong></span>
<input id="countryHighlighting" type="checkbox">
<span class="switch" aria-hidden="true"></span>
</label>
<label class="switch-row" for="countryCities">
<span><strong>Country capitals &amp; hubs</strong></span>
<input id="countryCities" type="checkbox">
<span class="switch" aria-hidden="true"></span>
</label>
<label class="switch-row" for="companyApprovedOnly">
<span><strong>Approved locations</strong></span>
<input id="companyApprovedOnly" type="checkbox">
<span class="switch" aria-hidden="true"></span>
</label>
<label class="switch-row" for="availabilityZones">
<span><strong>Availability zones</strong></span>
<input id="availabilityZones" type="checkbox">
<span class="switch" aria-hidden="true"></span>
</label>
<label class="range-row" for="dcMarkerSize">
<span><strong>Marker size</strong><output id="dcSizeValue">5 px</output></span>
<input id="dcMarkerSize" type="range" min="2" max="8" step="1" value="5">
</label>
<div class="option-divider summary-divider"></div>
<button id="toggleCspCallouts" class="download-button summary-button" type="button" aria-pressed="false" title="Show CSP summaries by continent">CSP Summary</button>
<button id="toggleCustomerCallouts" class="download-button summary-button" type="button" aria-pressed="false" title="Show customer data-center summaries by continent">Customer DC Summary</button>
</div>
</div>

<section class="data-upload-card" aria-label="Location data">
<div class="location-search">
<label class="location-search-label" for="locationSearch">Find a region or AZ</label>
<div class="location-search-row">
<input id="locationSearch" type="search" placeholder="e.g. us-east-1 or region-a" autocomplete="off">
</div>
<output id="locationSearchResult" class="location-search-result" role="status" aria-live="polite"></output>
</div>
<div class="data-actions">
<label class="theme-toggle" for="themeMode">
<span>Dark mode</span>
<input id="themeMode" type="checkbox">
<span class="switch" aria-hidden="true"></span>
</label>
<label class="data-scope" for="dataScope" aria-label="JSON data scope">
<span>Customer</span>
<input id="dataScope" type="checkbox" checked aria-label="JSON data scope: Cloud">
<span class="switch" aria-hidden="true"></span>
<span>Cloud</span>
</label>
<label class="upload-button" for="locationDataUpload" title="Upload a JSON file for the selected data scope">
Upload JSON
<input id="locationDataUpload" type="file" accept="application/json,.json">
</label>
<button id="downloadLocationData" class="download-button" type="button" title="Download JSON for the selected data scope">Download JSON</button>
</div>
</section>

</div>
</body>
</html>
